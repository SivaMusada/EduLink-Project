spring.application.name=learning-service
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/edulink_learning?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.mvc.async.request-timeout=120000
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

file.upload-dir=uploads/materials

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

jwt.secret=edulink-super-secret-key-for-jwt-signing-2024

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${server.port}
