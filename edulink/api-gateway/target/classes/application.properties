spring.application.name=api-gateway
server.port=8090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

jwt.secret=edulink-super-secret-key-for-jwt-signing-2024

spring.cloud.gateway.httpclient.max-header-size=65536
spring.cloud.gateway.httpclient.max-initial-line-length=65536
spring.cloud.gateway.httpclient.response-timeout=120000
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

spring.codec.max-in-memory-size=50MB
spring.cloud.gateway.httpclient.pool.max-connections=500
server.tomcat.max-http-form-post-size=50MB

# --- Open routes (NO JWT) ---
spring.cloud.gateway.routes[0].id=identity-service-login
spring.cloud.gateway.routes[0].uri=lb://identity-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/login

spring.cloud.gateway.routes[1].id=identity-service-register
spring.cloud.gateway.routes[1].uri=lb://identity-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/register

spring.cloud.gateway.routes[2].id=identity-service-register-student
spring.cloud.gateway.routes[2].uri=lb://identity-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/register/student

# --- Protected routes (JWT required) ---
spring.cloud.gateway.routes[3].id=identity-service-protected
spring.cloud.gateway.routes[3].uri=lb://identity-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[4].id=student-service
spring.cloud.gateway.routes[4].uri=lb://student-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/students/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[5].id=course-service
spring.cloud.gateway.routes[5].uri=lb://course-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/courses/**,/api/classes/**
spring.cloud.gateway.routes[5].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[6].id=learning-service
spring.cloud.gateway.routes[6].uri=lb://learning-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/materials/**,/api/assignments/**
spring.cloud.gateway.routes[6].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[7].id=exam-service
spring.cloud.gateway.routes[7].uri=lb://exam-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/exams/**,/api/grades/**,/api/submissions/**,/api/dashboard/**
spring.cloud.gateway.routes[7].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[8].id=attendance-service
spring.cloud.gateway.routes[8].uri=lb://attendance-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/attendance/**,/api/performance/**
spring.cloud.gateway.routes[8].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[9].id=compliance-service
spring.cloud.gateway.routes[9].uri=lb://compliance-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/compliance/**,/api/audits/**
spring.cloud.gateway.routes[9].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[10].id=reporting-service
spring.cloud.gateway.routes[10].uri=lb://reporting-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/reports/**
spring.cloud.gateway.routes[10].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[11].id=notification-service
spring.cloud.gateway.routes[11].uri=lb://notification-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[11].filters[0]=JwtAuthFilter
